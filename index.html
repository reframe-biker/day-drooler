<style>
  :root {
    --blue: #2B22D6;
    --blue-deep: #1E17A8;
    --orange: #F9A21B;
    --red: #E8341C;
    --cream: #FBF1D3;
    --ink: #000;
    --slab: "Alfa Slab One", "Rockwell Extra Bold", Georgia, serif;
    --cond: "Anton", "Impact", "Arial Narrow", sans-serif;
    --mono: "Space Mono", ui-monospace, "Courier New", monospace;
    --script: "Caveat", "Brush Script MT", cursive;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--blue); }
  body { margin: 0; background: var(--blue); color: var(--cream); font-family: var(--mono); -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 28px 18px 0; }

  h1 {
    font-family: var(--slab); font-weight: 400; color: var(--orange);
    font-size: clamp(2.6rem, 13.5vw, 4.6rem); line-height: .95; margin: 0;
    text-shadow: 3px 3px 0 var(--red), 5px 5px 0 var(--red);
    letter-spacing: .01em; text-align: center;
  }
  .tourname {
    display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline;
    gap: 0 .4em; margin: 12px 0 22px; color: var(--orange); text-align: center;
  }
  .tourname .c { font-family: var(--slab); font-size: clamp(1.15rem, 5.4vw, 1.6rem); text-shadow: 2px 2px 0 var(--red); }

  .tape {
    border: 5px solid var(--orange); border-radius: 22px; overflow: hidden;
    box-shadow: 6px 6px 0 var(--red); background: #000; line-height: 0;
  }
  .tape img { width: 100%; height: auto; display: block; }

  ol.shows { list-style: none; margin: 30px 0 0; padding: 0; }
  .show {
    display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; align-items: center;
    padding: 16px 0 18px; border-bottom: 3px dotted rgba(251,241,211,.45);
    position: relative;
  }
  .show:first-child { border-top: 3px dotted rgba(251,241,211,.45); }
  .date {
    grid-column: 1 / -1; font-family: var(--slab); color: var(--orange);
    font-size: 1.7rem; line-height: 1; text-shadow: 2px 2px 0 var(--red);
  }
  .venue { font-family: var(--cond); font-size: 1.85rem; line-height: 1.05; color: var(--cream); letter-spacing: .01em; }
  .city { font-family: var(--mono); font-weight: 700; color: var(--orange); font-size: .82rem; letter-spacing: .22em; text-transform: uppercase; margin-top: 2px; }
  .city .time { color: var(--cream); margin-left: 1.2em; white-space: nowrap; }
  .btns { grid-row: 2 / span 2; grid-column: 2; display: flex; flex-direction: column; gap: 8px; align-self: center; }
  .btn {
    display: block; text-align: center; text-decoration: none; min-width: 108px;
    font-family: var(--cond); font-size: 1.15rem; letter-spacing: .04em; padding: 9px 14px 8px;
    border: 3px solid var(--ink); border-radius: 4px; box-shadow: 3px 3px 0 var(--ink);
    transition: transform .08s, box-shadow .08s;
  }
  .btn.rsvp { background: var(--orange); color: var(--ink); }
  .btn.tix  { background: var(--cream); color: var(--ink); }
  .btn { -webkit-tap-highlight-color: transparent; }
  .btn:active, .btn.pressed { transform: translate(3px,3px); box-shadow: 0 0 0 var(--ink); }
  .btn:focus-visible { outline: 3px solid var(--cream); outline-offset: 3px; }

  .sticker {
    position: absolute; right: 0; top: 10px; transform: rotate(4deg);
    background: var(--red); color: var(--cream); font-family: var(--cond); font-size: 1rem;
    padding: 3px 10px 2px; border: 3px solid var(--cream); box-shadow: 2px 2px 0 rgba(0,0,0,.35);
  }
  .show.past { opacity: .42; }
  .show.past .btns { display: none; }
  .show.past .date::after { content: " played"; font-family: var(--mono); font-size: .8rem; text-shadow: none; color: var(--cream); letter-spacing: .1em; }

  .with { margin: 26px 0 6px; font-family: var(--cond); font-size: 1.5rem; color: var(--cream); }
  .with span { color: var(--orange); }
  .note { font-size: .85rem; margin: 0 0 22px; }
  .ig { display: inline-block; color: var(--orange); font-weight: 700; text-underline-offset: 3px; }
  .ig:focus-visible { outline: 3px solid var(--cream); outline-offset: 3px; }

  .bars { display: grid; grid-template-columns: repeat(7, 1fr); height: 34px; margin-top: 34px; }
  .bars i:nth-child(1){background:#fff} .bars i:nth-child(2){background:#FFE600} .bars i:nth-child(3){background:#00E5F2}
  .bars i:nth-child(4){background:#22D63B} .bars i:nth-child(5){background:#FF3DCB} .bars i:nth-child(6){background:#E8231C}
  .bars i:nth-child(7){background:var(--blue-deep)}

  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
  @media (max-width: 380px) { .venue { font-size: 1.55rem; } .btn { min-width: 92px; font-size: 1.05rem; } }
</style>
</head>

  <p class="with"><span>WITH</span> KMPH + CATFISH MALAYSIA</p>
  <p class="note">CDs and tees at every show.<br>
    <a class="ig" href="https://www.instagram.com/daydrooler_/">Follow us on Instagram</a> ·

<div class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>

<script>
  /* ===== EDIT HERE =====
     rsvp:    your Partiful link
     tickets: the venue's ticket link (leave "" to hide the button)
     date:    YYYY-MM-DD; shows auto-grey out the day after
     time:    e.g. "8 PM" (leave "" to show nothing)                     */
  const SHOWS = [
    { date: "2026-12-14", venue: "Grandma’s House", city: "Hanover",       time: "",      rsvp: "https://partiful.com/e/LJykKxWijiGWFHqahqk4", tickets: "" },
    // Burlington not confirmed yet; uncomment once it is (and add it back to og:description)
    // { date: "2026-12-15", venue: "Monkey Bar",     city: "Burlington",    time: "",      rsvp: "https://partiful.com/e/Hz8DhcMnjfQoQ19kFbDc", tickets: "" },
    { date: "2026-12-16", venue: "O’Brien’s",       city: "Boston",        time: "8 PM",  rsvp: "https://partiful.com/e/GQAJ4qiFzejiIWKTxcDV", tickets: "" },
    { date: "2026-12-20", venue: "Mercury Lounge",  city: "New York City", time: "6 PM",  rsvp: "https://partiful.com/e/Fsjw3qLEpITE5HhZZ2Su", tickets: "" },
    { date: "2026-12-22", venue: "The Lilypad",     city: "Boston",        time: "10 PM", rsvp: "https://partiful.com/e/2iZnXxu56ZiUVb7sip6u", tickets: "" },
  ];
  /* ===================== */

  const M = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
  const today = new Date(); today.setHours(0,0,0,0);
  const list = document.getElementById("shows");
  let nextMarked = false;

  for (const s of SHOWS) {
    const [y, m, d] = s.date.split("-").map(Number);
    const day = new Date(y, m - 1, d);
    const past = day < today;
    const li = document.createElement("li");
    li.className = "show" + (past ? " past" : "");

    const date = document.createElement("div");
    date.className = "date"; date.textContent = M[m - 1] + " " + d;
    const venue = document.createElement("div");
    venue.className = "venue"; venue.textContent = s.venue.toUpperCase();
    const city = document.createElement("div");
    city.className = "city"; city.textContent = s.city;
    if (s.time) {
      const t = document.createElement("span"); t.className = "time"; t.textContent = s.time;
      city.append(t);
    }

    const btns = document.createElement("div"); btns.className = "btns";
    if (s.rsvp) {
      const a = document.createElement("a"); a.className = "btn rsvp"; a.href = s.rsvp;
      a.textContent = "RSVP"; a.setAttribute("aria-label", "RSVP for " + s.venue + ", " + s.city);
      btns.append(a);
    }
    if (s.tickets) {
      const a = document.createElement("a"); a.className = "btn tix"; a.href = s.tickets;
      a.textContent = "TICKETS"; a.setAttribute("aria-label", "Tickets for " + s.venue + ", " + s.city);
      btns.append(a);
    }

    li.append(date, venue, city, btns);
    if (!past && !nextMarked) {
      const st = document.createElement("span"); st.className = "sticker";
      st.textContent = day.getTime() === new Date(2026, 11, 14).getTime() ? "DEBUT" : "NEXT UP";
      li.append(st); nextMarked = true;
    }
    list.append(li);
  }

  // Phones navigate the instant a tap lands, so the press never shows.
  // Hold the pressed state briefly, then follow the link.
  document.addEventListener("touchstart", () => {}, { passive: true }); // lets :active fire on iOS
  list.addEventListener("click", e => {
    const a = e.target.closest(".btn");
    if (!a || e.button || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    e.preventDefault();
    a.classList.add("pressed");
    setTimeout(() => { location.href = a.href; }, 140);
  });
  // Coming back with the Back button can restore the page mid-press
  addEventListener("pageshow", () => {
    document.querySelectorAll(".btn.pressed").forEach(b => b.classList.remove("pressed"));
  });
</script>
